services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: tech-challenge-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/realms/g52"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    container_name: tech-challenge-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ./app
      dockerfile: Dockerfile.multistage
    container_name: tech-challenge-app
    restart: unless-stopped
    depends_on:
      mailpit:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: dev@local
      MAIL_PASSWORD: dev
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
      APPROVAL_SECRET: local-dev-secret-change-me
      APP_BASE_URL: http://localhost:8080
      APPROVAL_TTL_MINUTES: 1440
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/g52/protocol/openid-connect/certs