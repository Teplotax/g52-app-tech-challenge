services:
  postgres:
    image: postgres:16-alpine
    container_name: tech-challenge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: techchallenge
      POSTGRES_USER: techchallenge
      POSTGRES_PASSWORD: techchallenge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techchallenge -d techchallenge"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    build:
      context: ./keycloak
    container_name: tech-challenge-keycloak
    restart: unless-stopped
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_CLIENT_ID: local-dev-client-id
      KEYCLOAK_CLIENT_SECRET: local-dev-client-secret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/realms/g52"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    container_name: tech-challenge-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ./app
      dockerfile: Dockerfile.multistage
    container_name: tech-challenge-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: techchallenge
      DB_USERNAME: techchallenge
      DB_PASSWORD: techchallenge
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: dev@local
      MAIL_PASSWORD: dev
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
      APPROVAL_SECRET: local-dev-secret-change-me
      APP_BASE_URL: http://localhost:8081
      APPROVAL_TTL_MINUTES: 1440
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/g52/protocol/openid-connect/certs

volumes:
  postgres-data: