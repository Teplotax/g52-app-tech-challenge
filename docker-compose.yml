services:
  postgres:
    image: postgres:16-alpine
    container_name: tech-challenge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: techchallenge
      POSTGRES_USER: techchallenge
      POSTGRES_PASSWORD: techchallenge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techchallenge -d techchallenge"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: tech-challenge-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ./app
      dockerfile: Dockerfile.multistage
    container_name: tech-challenge-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: techchallenge
      DB_USERNAME: techchallenge
      DB_PASSWORD: techchallenge
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: dev@local
      MAIL_PASSWORD: dev
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
      APPROVAL_SECRET: local-dev-secret-change-me
      APP_BASE_URL: http://localhost:8081
      APPROVAL_TTL_MINUTES: 1440
      # Autenticação desligada localmente; no cluster a app valida o JWT da Lambda de autenticação por CPF
      AUTH_ENABLED: "false"

volumes:
  postgres-data: