name: "2 - [DEV] Build and Deploy"

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  group: dev-pipeline
  cancel-in-progress: true

jobs:
  config:
    name: Load Config
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      aws_region: ${{ steps.pipes.outputs.aws_region }}
      ecr_repository: ${{ steps.pipes.outputs.ecr_repository }}
      ecr_repository_keycloak: ${{ steps.pipes.outputs.ecr_repository_keycloak }}
      app_dir: ${{ steps.pipes.outputs.app_dir }}
      keycloak_dir: ${{ steps.pipes.outputs.keycloak_dir }}
      java_version: ${{ steps.pipes.outputs.java_version }}
      destroy: ${{ steps.pipes.outputs.destroy }}
      eks_cluster_name: ${{ steps.pipes.outputs.eks_cluster_name }}
      app_base_url: ${{ steps.pipes.outputs.app_base_url }}
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read .pipes.yml
        id: pipes
        run: |
          APP_DIR_PATTERN=$(yq '.app_dir' .pipes.yml)
          APP_DIR=$(ls -d $APP_DIR_PATTERN 2>/dev/null | head -1)

          echo "aws_region=$(yq '.aws_region' .pipes.yml)"                           >> $GITHUB_OUTPUT
          echo "ecr_repository=$(yq '.ecr_repository' .pipes.yml)"                   >> $GITHUB_OUTPUT
          echo "ecr_repository_keycloak=$(yq '.ecr_repository_keycloak' .pipes.yml)" >> $GITHUB_OUTPUT
          echo "java_version=$(yq '.java_version' .pipes.yml)"                       >> $GITHUB_OUTPUT
          echo "app_dir=$APP_DIR"                                                     >> $GITHUB_OUTPUT
          echo "keycloak_dir=$(yq '.keycloak_dir' .pipes.yml)"                       >> $GITHUB_OUTPUT
          echo "destroy=$(yq '.destroy' .pipes.yml)"                                 >> $GITHUB_OUTPUT
          echo "eks_cluster_name=$(yq '.eks_cluster_name' .pipes.yml)"               >> $GITHUB_OUTPUT
          echo "app_base_url=$(yq '.app_base_url' .pipes.yml)"                       >> $GITHUB_OUTPUT

      - name: Generate image tag
        id: tag
        run: echo "image_tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT
  test:
    name: Run unit tests
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ needs.config.outputs.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ needs.config.outputs.java_version }}
          distribution: temurin
          cache: maven

      - name: Run unit tests
        working-directory: ${{ needs.config.outputs.app_dir }}
        run: mvn -B test --no-transfer-progress
  build:
    name: Build & Push to ECR
    needs: [ config, test ]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ needs.config.outputs.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ needs.config.outputs.java_version }}
          distribution: temurin
          cache: maven

      - name: Build JAR
        working-directory: ${{ needs.config.outputs.app_dir }}
        run: mvn clean package -DskipTests --no-transfer-progress

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-terraform-dev
          aws-region: ${{ needs.config.outputs.aws_region }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push app image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ needs.config.outputs.ecr_repository }}
          IMAGE_TAG: ${{ needs.config.outputs.image_tag }}
          APP_DIR: ${{ needs.config.outputs.app_dir }}
        run: |
          FULL_IMAGE="$REGISTRY/$REPOSITORY:$IMAGE_TAG"

          docker build -t $FULL_IMAGE $APP_DIR
          docker push $FULL_IMAGE

          echo "Pushed: $FULL_IMAGE"

      - name: Build, tag and push keycloak image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ needs.config.outputs.ecr_repository_keycloak }}
          IMAGE_TAG: ${{ needs.config.outputs.image_tag }}
          KEYCLOAK_DIR: ${{ needs.config.outputs.keycloak_dir }}
        run: |
          FULL_IMAGE="$REGISTRY/$REPOSITORY:$IMAGE_TAG"

          docker build -t $FULL_IMAGE $KEYCLOAK_DIR
          docker push $FULL_IMAGE

          echo "Pushed: $FULL_IMAGE"
  deploy:
    name: Deploy to EKS
    needs: [ config, build ]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev

    env:
      APP_IMAGE: ${{ needs.config.outputs.ecr_repository }}:${{ needs.config.outputs.image_tag }}
      KEYCLOAK_IMAGE: ${{ needs.config.outputs.ecr_repository_keycloak }}:${{ needs.config.outputs.image_tag }}
      APP_BASE_URL: ${{ needs.config.outputs.app_base_url }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      APPROVAL_SECRET: ${{ secrets.APPROVAL_SECRET }}
      KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-terraform-dev
          aws-region: ${{ needs.config.outputs.aws_region }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ needs.config.outputs.eks_cluster_name }} \
            --region ${{ needs.config.outputs.aws_region }}

      - name: Render manifests
        run: |
          export APP_IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.APP_IMAGE }}"
          export KEYCLOAK_IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.KEYCLOAK_IMAGE }}"

          mkdir -p k8s-rendered
          for f in k8s/namespace.yaml k8s/configmap.yaml k8s/secret.yaml k8s/deployment.yaml k8s/service.yaml k8s/hpa.yaml; do
            envsubst < "$f" > "k8s-rendered/$(basename $f)"
          done

      - name: Apply manifests
        if: needs.config.outputs.destroy != 'true'
        run: |
          kubectl apply -f k8s-rendered/namespace.yaml
          kubectl apply -f k8s-rendered/configmap.yaml
          kubectl apply -f k8s-rendered/secret.yaml
          kubectl apply -f k8s-rendered/deployment.yaml
          kubectl apply -f k8s-rendered/service.yaml
          kubectl apply -f k8s-rendered/hpa.yaml

      - name: Wait for rollout
        if: needs.config.outputs.destroy != 'true'
        run: |
          kubectl rollout status deployment/tech-challenge-ms -n tech-challenge --timeout=300s

      - name: Destroy manifests
        if: needs.config.outputs.destroy == 'true'
        run: |
          kubectl delete -f k8s-rendered/hpa.yaml --ignore-not-found
          kubectl delete -f k8s-rendered/service.yaml --ignore-not-found
          kubectl delete -f k8s-rendered/deployment.yaml --ignore-not-found
          kubectl delete -f k8s-rendered/configmap.yaml --ignore-not-found
          kubectl delete -f k8s-rendered/secret.yaml --ignore-not-found
  release:
    name: Create Release Branch & PR
    needs: [ config, deploy ]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.config.result == 'success' &&
      needs.deploy.result == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          git fetch --all

          LAST=$(git for-each-ref \
            --format='%(refname:short)' \
            refs/remotes/origin/release/v* \
            | sed 's|origin/release/v||' \
            | sort -V \
            | tail -n 1)

          if [ -z "$LAST" ]; then
            NEXT="0.0.1"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST"
            PATCH=$((PATCH + 1))
            NEXT="$MAJOR.$MINOR.$PATCH"
          fi

          echo "next_version=$NEXT" >> $GITHUB_OUTPUT

      - name: Create or reuse release branch
        id: branch
        run: |
          BRANCH="release/v${{ steps.version.outputs.next_version }}"
          git fetch --all

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            echo "Branch already exists. Reusing."
          else
            git checkout main && git pull origin main
            git checkout -b "$BRANCH"
            git push origin "$BRANCH"
          fi

          echo "branch_name=$BRANCH" >> $GITHUB_OUTPUT

      - name: Open PR (develop -> release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.branch.outputs.branch_name }}"

          OPEN=$(gh pr list \
            --head develop \
            --base "$BRANCH" \
            --state open \
            --json number \
            --jq 'length')

          if [ "$OPEN" -eq "0" ]; then
            gh pr create \
              --base "$BRANCH" \
              --head develop \
              --title "Release $BRANCH" \
              --body "Promoting develop into $BRANCH"
          else
            echo "PR already exists. Skipping."
          fi