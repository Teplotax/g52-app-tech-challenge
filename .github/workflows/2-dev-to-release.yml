name: "2 - [DEV] Build and Deploy"

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  group: dev-pipeline
  cancel-in-progress: true

jobs:
  config:
    name: Load Config
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      aws_region: ${{ steps.pipes.outputs.aws_region }}
      ecr_repository: ${{ steps.pipes.outputs.ecr_repository }}
      app_dir: ${{ steps.pipes.outputs.app_dir }}
      java_version: ${{ steps.pipes.outputs.java_version }}
      service_name: ${{ steps.tfvars.outputs.service_name }}
      ecs_cluster: ${{ steps.tfvars.outputs.ecs_cluster }}
      destroy: ${{ steps.tfvars.outputs.destroy }}
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read .pipes.yml
        id: pipes
        run: |
          APP_DIR_PATTERN=$(yq '.app_dir' .pipes.yml)
          APP_DIR=$(ls -d $APP_DIR_PATTERN 2>/dev/null | head -1)

          echo "aws_region=$(yq '.aws_region' .pipes.yml)"         >> $GITHUB_OUTPUT
          echo "ecr_repository=$(yq '.ecr_repository' .pipes.yml)" >> $GITHUB_OUTPUT
          echo "java_version=$(yq '.java_version' .pipes.yml)"     >> $GITHUB_OUTPUT
          echo "app_dir=$APP_DIR"                                   >> $GITHUB_OUTPUT

      - name: Read terraform.tfvars
        id: tfvars
        working-directory: infra/inventories/dev
        run: |
          extract() { grep -E "^$1\s*=" terraform.tfvars | awk -F '=' '{gsub(/[" ]/, "", $2); print $2}'; }

          echo "service_name=$(extract service_name)" >> $GITHUB_OUTPUT
          echo "ecs_cluster=$(extract cluster_name)"  >> $GITHUB_OUTPUT
          echo "destroy=$(extract destroy)"           >> $GITHUB_OUTPUT

      - name: Generate image tag
        id: tag
        run: echo "image_tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT
  build:
    name: Build & Push to ECR
    needs: config
    if: |
      needs.config.outputs.destroy != 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ needs.config.outputs.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ needs.config.outputs.java_version }}
          distribution: temurin
          cache: maven

      - name: Build JAR
        working-directory: ${{ needs.config.outputs.app_dir }}
        run: mvn clean package -DskipTests --no-transfer-progress

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::403339561517:role/github-actions-terraform-dev
          aws-region: ${{ needs.config.outputs.aws_region }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ needs.config.outputs.ecr_repository }}
          SERVICE: ${{ needs.config.outputs.service_name }}
          IMAGE_TAG: ${{ needs.config.outputs.image_tag }}
          APP_DIR: ${{ needs.config.outputs.app_dir }}
        run: |
          FULL_IMAGE="$REGISTRY/$REPOSITORY:$IMAGE_TAG"

          docker build -t $FULL_IMAGE $APP_DIR
          docker push $FULL_IMAGE

          echo "Pushed: $FULL_IMAGE"
  terraform:
    name: Terraform
    needs: [ config, build ]
    if: always() && needs.config.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::403339561517:role/github-actions-terraform-dev
          aws-region: ${{ needs.config.outputs.aws_region }}

      - name: Terraform Init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=teplotax-terraform-state-dev" \
            -backend-config="key=dev/${{ needs.config.outputs.service_name }}/terraform.tfstate" \
            -backend-config="region=${{ needs.config.outputs.aws_region }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: |
          terraform plan \
            -var-file=inventories/dev/terraform.tfvars \
            -var="image_tag=${{ needs.config.outputs.image_tag }}"

      - name: Terraform Destroy
        if: needs.config.outputs.destroy == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          terraform destroy -auto-approve \
            -var-file=inventories/dev/terraform.tfvars

      - name: Terraform Apply
        if: needs.config.outputs.destroy != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          terraform apply -auto-approve \
            -var-file=inventories/dev/terraform.tfvars \
            -var="image_tag=${{ needs.config.outputs.image_tag }}"
  deploy:
    name: Deploy to ECS
    needs: [ config, terraform ]
    if: |
      needs.config.outputs.destroy != 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::403339561517:role/github-actions-terraform-dev
          aws-region: ${{ needs.config.outputs.aws_region }}

      - name: Force ECS deployment
        run: |
          aws ecs update-service \
            --cluster ${{ needs.config.outputs.ecs_cluster }} \
            --service ${{ needs.config.outputs.service_name }} \
            --force-new-deployment
  release:
    name: Create Release Branch & PR
    needs: deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          git fetch --all

          LAST=$(git for-each-ref \
            --format='%(refname:short)' \
            refs/remotes/origin/release/v* \
            | sed 's|origin/release/v||' \
            | sort -V \
            | tail -n 1)

          if [ -z "$LAST" ]; then
            NEXT="0.0.1"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST"
            PATCH=$((PATCH + 1))
            NEXT="$MAJOR.$MINOR.$PATCH"
          fi

          echo "next_version=$NEXT" >> $GITHUB_OUTPUT

      - name: Create or reuse release branch
        id: branch
        run: |
          BRANCH="release/v${{ steps.version.outputs.next_version }}"
          git fetch --all

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            echo "Branch already exists. Reusing."
          else
            git checkout main && git pull origin main
            git checkout -b "$BRANCH"
            git push origin "$BRANCH"
          fi

          echo "branch_name=$BRANCH" >> $GITHUB_OUTPUT

      - name: Open PR (develop → release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.branch.outputs.branch_name }}"

          OPEN=$(gh pr list \
            --head develop \
            --base "$BRANCH" \
            --state open \
            --json number \
            --jq 'length')

          if [ "$OPEN" -eq "0" ]; then
            gh pr create \
              --base "$BRANCH" \
              --head develop \
              --title "Release $BRANCH" \
              --body "Promoting develop into $BRANCH"
          else
            echo "PR already exists. Skipping."
          fi