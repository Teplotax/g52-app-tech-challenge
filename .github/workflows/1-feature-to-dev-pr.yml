name: "1 - [FEAT] Build & PR"

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests and generate coverage report
        working-directory: app
        run: mvn verify -B

      - name: SonarQube analysis
        working-directory: app
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          mvn sonar:sonar \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.projectKey=${SONAR_PROJECT_KEY} \
            -B

  Create:
    needs: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create PR if it doesn't exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"

          echo "Checking for existing PR from $BRANCH to develop..."

          PR_EXISTS=$(gh pr list \
            --head "$BRANCH" \
            --base develop \
            --state open \
            --json number \
            --jq 'length')

          if [ "$PR_EXISTS" -eq "0" ]; then
            echo "No PR found. Creating one..."

            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "Auto PR: $BRANCH → develop" \
              --body "Automatically created PR from $BRANCH"
          else
            echo "PR already exists. Skipping."
          fi