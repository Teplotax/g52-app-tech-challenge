server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:techchallenge}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:techchallenge}
    password: ${DB_PASSWORD:techchallenge}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  # sql.init defaults to "embedded" (only runs data.sql for H2/HSQL/etc).
  # Left unset here on purpose: data.sql isn't idempotent (plain INSERTs), so
  # auto-running it against the persistent Postgres pod on every restart would
  # crash the app with duplicate-key errors after the first successful boot.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/g52/protocol/openid-connect/certs}
  mail:
    host: ${MAIL_HOST:mailpit}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:dev@local}
    password: ${MAIL_PASSWORD:dev}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  approval:
    secret: ${APPROVAL_SECRET:local-dev-secret-change-me}
    base-url: ${APP_BASE_URL:http://localhost:8080}
    ttl-minutes: ${APPROVAL_TTL_MINUTES:1440}

logging:
  level:
    root: info