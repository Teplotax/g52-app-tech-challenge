server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: tech-challenge-ms
  # Flyway migrations target Postgres; off by default so it never runs
  # against the auto-configured embedded H2 used when no profile is active.
  # local/docker profiles turn it back on for the real database.
  flyway:
    enabled: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:dev@local}
    password: ${MAIL_PASSWORD:dev}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

management:
  endpoints:
    web:
      exposure:
        include: info, health, prometheus, metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: info

app:
  security:
    # Desligado apenas para rodar localmente (profile local / docker-compose)
    enabled: ${AUTH_ENABLED:true}
    jwt:
      # JWKS publicado pela Lambda de autenticação por CPF, exposto pelo API Gateway
      jwk-set-uri: ${JWT_JWK_SET_URI:}
      issuer: ${JWT_ISSUER:g52-lambda-auth}
      audience: ${JWT_AUDIENCE:tech-challenge-api}
