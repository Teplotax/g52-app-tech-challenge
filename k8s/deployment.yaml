apiVersion: apps/v1
kind: Deployment
metadata:
  name: tech-challenge-ms
  namespace: tech-challenge
  labels:
    app: tech-challenge-ms
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tech-challenge-ms
  template:
    metadata:
      labels:
        app: tech-challenge-ms
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z "$DB_HOST" "$DB_PORT"; do echo waiting for postgres; sleep 2; done
          envFrom:
            - configMapRef:
                name: tech-challenge-config
      containers:
        - name: app
          image: "${APP_IMAGE}"
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: tech-challenge-config
            - secretRef:
                name: tech-challenge-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests:
              cpu: "300m"
              memory: "500Mi"
            limits:
              cpu: "700m"
              memory: "900Mi"
