apiVersion: apps/v1
kind: Deployment
metadata:
  name: tech-challenge-ms
  namespace: tech-challenge
  labels:
    app: tech-challenge-ms
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tech-challenge-ms
  template:
    metadata:
      labels:
        app: tech-challenge-ms
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z "$DB_HOST" "$DB_PORT"; do echo waiting for postgres; sleep 2; done
          envFrom:
            - configMapRef:
                name: tech-challenge-config
      containers:
        - name: app
          image: "${APP_IMAGE}"
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: tech-challenge-config
            - secretRef:
                name: tech-challenge-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests:
              cpu: "300m"
              memory: "500Mi"
            limits:
              cpu: "700m"
              memory: "900Mi"
        - name: keycloak
          image: "${KEYCLOAK_IMAGE}"
          ports:
            - containerPort: 9000
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                configMapKeyRef:
                  name: tech-challenge-config
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tech-challenge-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_HTTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: tech-challenge-config
                  key: KC_HTTP_PORT
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tech-challenge-secrets
                  key: KEYCLOAK_CLIENT_ID
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tech-challenge-secrets
                  key: KEYCLOAK_CLIENT_SECRET
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              cpu: "150m"
              memory: "350Mi"
            limits:
              cpu: "400m"
              memory: "600Mi"
        - name: mailpit
          image: "axllent/mailpit:latest"
          ports:
            - containerPort: 1025
            - containerPort: 8025
          env:
            - name: MP_SMTP_AUTH_ACCEPT_ANY
              value: "true"
            - name: MP_SMTP_AUTH_ALLOW_INSECURE
              value: "true"
            - name: MP_WEBROOT
              value: "dev/mailpit"
          readinessProbe:
            exec:
              command: ["/mailpit", "readyz"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "48Mi"
            limits:
              cpu: "150m"
              memory: "96Mi"