apiVersion: v1
kind: ConfigMap
metadata:
  name: tech-challenge-config
  namespace: tech-challenge
data:
  SERVER_PORT: "8080"
  SPRING_PROFILES_ACTIVE: "docker"
  MAIL_HOST: "mailpit"
  MAIL_PORT: "1025"
  MAIL_USERNAME: "dev@local"
  MAIL_SMTP_AUTH: "false"
  MAIL_SMTP_STARTTLS: "false"
  APPROVAL_TTL_MINUTES: "1440"
  APP_BASE_URL: "${APP_BASE_URL}"
  JWT_JWK_SET_URI: "${JWT_JWK_SET_URI}"
  JWT_ISSUER: "g52-lambda-auth"
  JWT_AUDIENCE: "tech-challenge-api"
  DB_HOST: "${DB_HOST}"
  DB_PORT: "${DB_PORT}"
  DB_NAME: "${DB_NAME}"
  DB_USERNAME: "${DB_USERNAME}"
  # logs em json (ecs), com o correlationId do mdc
  LOGGING_STRUCTURED_FORMAT_CONSOLE: "ecs"
  # new relic apm; desligado se o ambiente não tiver license key
  NEW_RELIC_AGENT_ENABLED: "${NEW_RELIC_AGENT_ENABLED}"
  NEW_RELIC_APP_NAME: "tech-challenge-ms-${ENVIRONMENT}"
  NEW_RELIC_LABELS: "environment:${ENVIRONMENT}"
  NEW_RELIC_LOG_FILE_NAME: "STDOUT"